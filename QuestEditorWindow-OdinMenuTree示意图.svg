<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252525"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303030"/>
      <stop offset="1" stop-color="#252525"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#63a5ff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ffb454"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
      .title { fill: #f3f3f3; font-size: 26px; font-weight: 700; }
      .subtitle { fill: #a9a9a9; font-size: 15px; }
      .label { fill: #d6d6d6; font-size: 16px; }
      .small { fill: #a8a8a8; font-size: 13px; }
      .tiny { fill: #8e8e8e; font-size: 12px; }
      .field { fill: #dedede; font-size: 15px; }
      .line { stroke: #454545; stroke-width: 1; }
      .blueLine { stroke: #63a5ff; stroke-width: 2; fill: none; marker-end: url(#arrowBlue); }
      .orangeLine { stroke: #ffb454; stroke-width: 2; fill: none; marker-end: url(#arrowOrange); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#111111"/>
  <text x="80" y="66" class="font title">QuestEditorWindow · OdinMenuTree 结构示意</text>
  <text x="80" y="96" class="font subtitle">对应 QuestSystem/Editor/Window/QuestEditorWindow.cs 的配置页布局</text>

  <!-- Unity editor window -->
  <g filter="url(#shadow)">
    <rect x="80" y="135" width="1440" height="680" rx="8" fill="url(#bg)" stroke="#4b4b4b"/>
    <rect x="80" y="135" width="1440" height="48" rx="8" fill="#303030"/>
    <rect x="80" y="168" width="1440" height="15" fill="#303030"/>
    <circle cx="106" cy="159" r="6" fill="#e16d63"/>
    <circle cx="126" cy="159" r="6" fill="#e9bb55"/>
    <circle cx="146" cy="159" r="6" fill="#65bb73"/>
    <text x="180" y="166" class="font label" font-weight="600">Quest System</text>
    <text x="1432" y="166" class="font small">Unity EditorWindow</text>

    <!-- top tabs -->
    <rect x="104" y="203" width="1392" height="44" rx="4" fill="#202020" stroke="#3e3e3e"/>
    <rect x="108" y="207" width="86" height="36" rx="3" fill="#4a80c8"/>
    <text x="136" y="231" class="font field" font-weight="700">配置</text>
    <rect x="199" y="207" width="86" height="36" rx="3" fill="#303030"/>
    <text x="229" y="231" class="font label">GM</text>
    <rect x="1396" y="207" width="84" height="36" rx="3" fill="#3b3b3b"/>
    <text x="1414" y="231" class="font small">新建任务</text>

    <!-- left panel -->
    <rect x="104" y="264" width="388" height="515" rx="4" fill="url(#panel)" stroke="#111111"/>
    <rect x="104" y="264" width="388" height="56" fill="#3c3c3c"/>
    <rect x="104" y="318" width="388" height="2" fill="#4b91ed"/>
    <text x="122" y="288" class="font label" font-weight="700">任务</text>
    <text x="122" y="307" class="font small">New Quest</text>
    <rect x="122" y="334" width="352" height="34" rx="3" fill="#202020" stroke="#555555"/>
    <text x="139" y="356" class="font small">⌕  搜索任务资源</text>

    <!-- Odin menu tree -->
    <rect x="122" y="380" width="352" height="377" rx="3" fill="#202020" stroke="#3e3e3e"/>
    <text x="138" y="408" class="font label" font-weight="700">▾ 任务</text>
    <text x="160" y="440" class="font label">▾ Narrative</text>
    <text x="182" y="472" class="font label">▾ QuestSystem</text>
    <text x="204" y="504" class="font label">▾ QuestSo</text>
    <rect x="215" y="516" width="243" height="30" rx="3" fill="#3d6fae" stroke="#68a7ff"/>
    <text x="226" y="537" class="font field" font-weight="600">▣  New Quest</text>
    <text x="226" y="573" class="font label">▣  Kill Slime</text>
    <text x="226" y="609" class="font label">▣  Collect Herb</text>
    <line x1="158" y1="443" x2="158" y2="665" class="line"/>
    <line x1="180" y1="475" x2="180" y2="665" class="line"/>
    <line x1="202" y1="507" x2="202" y2="665" class="line"/>
    <text x="138" y="712" class="font tiny">OdinMenuTree</text>
    <text x="138" y="734" class="font tiny">DrawSearchToolbar · DrawFoldoutTriangle</text>

    <!-- splitter -->
    <rect x="501" y="264" width="5" height="515" fill="#151515"/>
    <rect x="502" y="410" width="3" height="100" fill="#4b91ed"/>

    <!-- inspector panel -->
    <rect x="518" y="264" width="978" height="515" rx="4" fill="#2b2b2b" stroke="#111111"/>
    <rect x="518" y="264" width="978" height="56" fill="#3c3c3c"/>
    <rect x="518" y="318" width="978" height="2" fill="#4b91ed"/>
    <text x="536" y="288" class="font label" font-weight="700">属性</text>
    <text x="536" y="307" class="font small">新手任务</text>

    <text x="548" y="354" class="font field">Quest Id</text>
    <rect x="800" y="333" width="640" height="34" rx="3" fill="#202020" stroke="#4f4f4f"/>
    <text x="817" y="356" class="font label">1001</text>
    <text x="548" y="402" class="font field">Category</text>
    <rect x="800" y="381" width="640" height="34" rx="3" fill="#202020" stroke="#4f4f4f"/>
    <text x="817" y="404" class="font label">主线任务        ▾</text>
    <text x="548" y="450" class="font field">Title</text>
    <rect x="800" y="429" width="640" height="34" rx="3" fill="#202020" stroke="#4f4f4f"/>
    <text x="817" y="452" class="font label">新手任务</text>
    <text x="548" y="498" class="font field">Description</text>
    <rect x="800" y="477" width="640" height="60" rx="3" fill="#202020" stroke="#4f4f4f"/>
    <text x="817" y="502" class="font label">帮助村民完成第一件委托</text>
    <text x="548" y="570" class="font field">Accept Mode</text>
    <rect x="800" y="549" width="640" height="34" rx="3" fill="#202020" stroke="#4f4f4f"/>
    <text x="817" y="572" class="font label">自动接受        ▾</text>
    <text x="548" y="618" class="font field">Goal List</text>
    <rect x="800" y="597" width="640" height="74" rx="3" fill="#202020" stroke="#4f4f4f"/>
    <text x="817" y="621" class="font label">▾  Element 0</text>
    <text x="846" y="647" class="font small">类型：对话       目标：DialogueEvent_Start</text>
    <text x="548" y="710" class="font field">Prerequisite Id List</text>
    <rect x="800" y="689" width="640" height="34" rx="3" fill="#202020" stroke="#4f4f4f"/>
    <text x="817" y="712" class="font small">0 items</text>

    <!-- bottom status -->
    <rect x="104" y="790" width="1392" height="1" fill="#484848"/>
    <text x="110" y="804" class="font tiny">点击左侧任务项 → selectedQuest 改变 → 右侧属性重绘</text>
  </g>

  <!-- callouts -->
  <path d="M 1070 52 C 1030 88 850 116 540 215" class="orangeLine"/>
  <circle cx="1070" cy="52" r="18" fill="#ffb454"/>
  <text x="1064" y="58" class="font" font-size="15" fill="#222" font-weight="700">1</text>
  <text x="1100" y="47" class="font label" font-weight="700">顶部页签</text>
  <text x="1100" y="69" class="font small">GUILayout.Toolbar：配置 / GM</text>

  <path d="M 66 484 C 90 484 120 500 225 520" class="blueLine"/>
  <circle cx="66" cy="484" r="18" fill="#63a5ff"/>
  <text x="60" y="490" class="font" font-size="15" fill="#162033" font-weight="700">2</text>
  <text x="26" y="526" class="font label" font-weight="700">左侧树形菜单</text>
  <text x="26" y="548" class="font small">OdinMenuTree：可搜索 / 折叠 / 选择</text>

  <path d="M 1510 510 C 1540 510 1540 540 1460 556" class="blueLine"/>
  <circle cx="1510" cy="510" r="18" fill="#63a5ff"/>
  <text x="1504" y="516" class="font" font-size="15" fill="#162033" font-weight="700">3</text>
  <text x="1245" y="852" class="font label" font-weight="700">右侧属性面板</text>
  <text x="1245" y="874" class="font small">SerializedObject：编辑 selectedQuest</text>
  <path d="M 1335 842 C 1300 800 1190 730 1100 620" class="blueLine"/>

  <path d="M 420 914 C 455 870 470 824 469 694" class="orangeLine"/>
  <circle cx="420" cy="914" r="18" fill="#ffb454"/>
  <text x="414" y="920" class="font" font-size="15" fill="#222" font-weight="700">4</text>
  <text x="450" y="910" class="font label" font-weight="700">菜单层级来源</text>
  <text x="450" y="932" class="font small">资产路径自动转换为 任务 / Narrative / QuestSystem / QuestSo / 资产名</text>

  <rect x="80" y="856" width="1040" height="92" rx="8" fill="#202020" stroke="#404040"/>
  <text x="104" y="886" class="font label" font-weight="700">关键判断</text>
  <text x="104" y="914" class="font small">你说的“左边下拉页签”在这份代码里准确说是 Odin 的折叠树形资源菜单，不是顶部 Toolbar 页签</text>
  <text x="104" y="936" class="font small">如果要做成真正的下拉式页签，需要另加一个 Popup / Toolbar 下拉控件</text>
</svg>
